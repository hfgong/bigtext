<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Shared suite background (Mobile LaTeX / AirCopy / 农历 / 漢字 / Bark) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="28%" cy="22%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </radialGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#090d16" flood-opacity="0.45" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bgGradient)" />
  <rect width="512" height="512" rx="118" fill="url(#innerGlow)" />
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <g transform="translate(256 256) scale(1.12) translate(-256 -256)">
    <g filter="url(#shadow)">
      <!-- Handle of the pickup sign -->
      <rect x="240" y="300" width="32" height="118" rx="10" fill="#bae6fd" />
      <!-- Sign board -->
      <rect x="104" y="128" width="304" height="196" rx="30" fill="url(#boardGrad)" />
      <!-- Big "Hi" drawn as shapes (no font needed) -->
      <g fill="url(#letterGrad)">
        <rect x="160" y="164" width="36" height="124" rx="6" />
        <rect x="246" y="164" width="36" height="124" rx="6" />
        <rect x="160" y="208" width="122" height="34" rx="4" />
        <rect x="318" y="204" width="36" height="84" rx="6" />
        <circle cx="336" cy="176" r="19" />
      </g>
    </g>
  </g>

  <!-- Sparkle ✦ -->
  <path d="M 432 382 Q 432 410, 404 410 Q 432 410, 432 438 Q 432 410, 460 410 Q 432 410, 432 382 Z"
        fill="url(#sparkleGrad)" filter="url(#glow)" />
  <circle cx="468" cy="370" r="6" fill="#67e8f9" />
</svg>
